<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef5fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Fish Hunt — catch, explore, collect. Every fish you catch becomes part of your collection.">
<title>Fish Hunt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#07111d; --navy-900:#0b1a2b; --navy-800:#10233a; --navy-700:#16304c; --navy-600:#1e3f63;
  --water:#1f7ae0; --water-2:#3ba0ff; --teal:#22c1c3; --ice:#e8f2ff; --mist:#a9bdd6; --fog:#798ea9;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --glass:rgba(13,29,48,.93); --glass-2:rgba(16,35,58,.96);
  --common:#8a97a8; --uncommon:#3ddc84; --rare:#3b8bff; --epic:#b45cff; --legendary:#f2b64a;
  --common-bg:rgba(138,151,168,.16); --uncommon-bg:rgba(61,220,132,.14); --rare-bg:rgba(59,139,255,.16); --epic-bg:rgba(180,92,255,.18); --legendary-bg:rgba(242,182,74,.18);
  --gold:#f2b64a; --danger:#ff5d6c; --ok:#3ddc84;
  --hdr:#0b1a2b; --hdr-2:#22395a; --sky-0:#eef5fb;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --script:"Caveat","Bradley Hand","Segoe Script",cursive;
  --fs-micro:10px; --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-base:15px; --fs-lg:17px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px; --fs-display:40px; --fs-input:16px;
  --r:18px; --r-sm:12px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --nav-h:76px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--navy-950);color:var(--ice);font-family:var(--sans);font-size:var(--fs-base);line-height:1.4;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--water-2);text-decoration:none}
img{display:block;max-width:100%}
h1,h2,h3{margin:0;font-weight:600}
.serif{font-family:var(--serif)}
.script{font-family:var(--script);font-weight:600}
.hide{display:none!important}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;background:transparent;display:flex;flex-direction:column}
#scene{position:absolute;top:0;left:0;right:0;height:100vh;z-index:0;pointer-events:none;overflow:hidden}
body{--ridge:205px}
body[data-hdr="center"]{--ridge:175px}
body[data-hdr="profile"]{--ridge:300px}
body[data-hdr="onb"]{--ridge:120px}
#scene .sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-0) 0px,#dbe9f5 calc(var(--ridge) - 90px),#c3d8ea var(--ridge),#9db8d2 calc(var(--ridge) + 110px),#3f6288 calc(var(--ridge) + 200px),var(--navy-950) calc(var(--ridge) + 320px))}
#scene svg{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--ridge) - 100px);width:max(100%,900px);height:auto}
#scene .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,17,29,0) 0px,rgba(7,17,29,0) calc(var(--ridge) + 90px),rgba(7,17,29,.62) calc(var(--ridge) + 190px),var(--navy-950) calc(var(--ridge) + 300px))}
#app>*{position:relative;z-index:1}

header.top{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safe-t)) 18px 8px}
header.top .brand{display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:10px;flex:1;min-width:0}
header.top .brand svg{width:46px;height:46px;flex:none}
header.top .wm{line-height:1}
header.top .wm b{display:block;font-family:var(--serif);font-size:var(--fs-2xl);font-weight:700;color:var(--hdr);letter-spacing:.2px}
header.top .wm small{display:block;font-size:9px;letter-spacing:.17em;white-space:nowrap;color:var(--hdr-2);margin-top:3px;font-weight:600}
header.top .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--hdr);position:relative}
header.top .ico svg{width:22px;height:22px}
header.top .ico .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--water-2);border:2px solid var(--sky-0)}
header.top .avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid rgba(11,26,43,.3);background:var(--navy-700);display:grid;place-items:center;font-weight:700;font-size:var(--fs-base)}
header.top .avatar img{width:100%;height:100%;object-fit:cover}

main#view{flex:1;padding:4px 16px calc(var(--nav-h) + var(--safe-b) + 24px);animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(7,17,29,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;z-index:50}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 0 10px;color:var(--mist);font-size:var(--fs-xs);font-weight:500;position:relative}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:#fff}
nav.bottom button.on::after{content:"";position:absolute;bottom:4px;width:22px;height:3px;border-radius:3px;background:var(--water-2)}
nav.bottom .rec{transform:translateY(-16px)}
nav.bottom .rec .cam{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5cb3ff,#1f7ae0 60%,#155cb0);box-shadow:0 8px 24px rgba(31,122,224,.55),0 0 0 6px rgba(31,122,224,.18);display:grid;place-items:center}
nav.bottom .rec .cam svg{width:28px;height:28px;color:#fff}
nav.bottom .rec span{margin-top:-2px}

/* ---------- Common blocks ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 2px 14px}
.page-h h1{font-family:var(--serif);font-size:var(--fs-3xl);font-weight:700;color:var(--hdr);letter-spacing:.2px;line-height:1.05}
.page-h p{margin:6px 0 0;color:var(--hdr-2);font-size:var(--fs-md)}
.page-h .tag{font-family:var(--script);font-size:var(--fs-xl);color:var(--hdr);text-align:right;line-height:1;opacity:.95;transform:rotate(-4deg);white-space:nowrap}
.sub-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 10px}
.sub-h h2{font-family:var(--serif);font-size:var(--fs-2xl);color:#fff}
.sub-h h2.sans{font-family:var(--sans);font-size:var(--fs-xl);font-weight:600}
.sub-h a,.sub-h button.lnk{color:#fff;font-size:var(--fs-md);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.sub-h a svg,.sub-h button.lnk svg{width:16px;height:16px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:500;font-size:var(--fs-md);padding:6px 0}
.back svg{width:20px;height:20px}
.centerh{text-align:center;padding:6px 0 14px;position:relative}
.centerh h1{font-family:var(--serif);font-size:var(--fs-2xl);color:var(--hdr)}
.centerh p{margin:4px 0 0;color:var(--hdr-2);font-size:var(--fs-md)}
.centerh .back{position:absolute;left:0;top:8px;color:var(--hdr)}
.centerh .right{position:absolute;right:0;top:8px}

.card{background:var(--glass);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.solid{background:var(--glass-2)}
.card+.card{margin-top:12px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--mist)}
.faint{color:var(--fog)}
.small{font-size:var(--fs-sm)}
.tiny{font-size:var(--fs-xs)}
.b{font-weight:600}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--mist);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:var(--fs-sm);font-weight:600;border:1px solid var(--line-2);background:rgba(255,255,255,.06);color:#fff;white-space:nowrap}
.pill svg{width:13px;height:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 6px 10px;margin:-2px -4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line-2);background:rgba(13,29,48,.9);color:#fff;font-size:var(--fs-md);font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip svg{width:15px;height:15px}
.chip.on{background:linear-gradient(180deg,#3177c0,#1f6fd0);border-color:transparent;box-shadow:0 4px 14px rgba(31,122,224,.4)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 18px;border-radius:14px;font-weight:600;font-size:var(--fs-lg);color:#fff;background:linear-gradient(180deg,#3177c0,#1f6fd0);box-shadow:0 8px 22px rgba(31,122,224,.35);transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line-2);box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#f3c161,#d8961f);color:#2b1a00}
.btn.danger{background:rgba(255,93,108,.14);border:1px solid rgba(255,93,108,.4);color:#ff8c98;box-shadow:none}
.btn.sm{padding:10px 14px;font-size:var(--fs-md);width:auto;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prog{height:9px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#3ba0ff,#1f7ae0);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.prog.green i{background:linear-gradient(90deg,#3ddc84,#1fb36a)}
.prog.gold i{background:linear-gradient(90deg,#f6cf7a,#d8961f)}

/* tier */
.tier{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid}
.tier svg{width:13px;height:13px}
.tier.common{color:#c9d3df;background:var(--common-bg);border-color:rgba(138,151,168,.45)}
.tier.uncommon{color:var(--uncommon);background:var(--uncommon-bg);border-color:rgba(61,220,132,.45)}
.tier.rare{color:#7fb2ff;background:var(--rare-bg);border-color:rgba(59,139,255,.5)}
.tier.epic{color:#d3a3ff;background:var(--epic-bg);border-color:rgba(180,92,255,.5)}
.tier.legendary{color:#ffd985;background:var(--legendary-bg);border-color:rgba(242,182,74,.55)}
.tc-common{color:var(--common)}.tc-uncommon{color:var(--uncommon)}.tc-rare{color:var(--rare)}.tc-epic{color:var(--epic)}.tc-legendary{color:var(--legendary)}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--glass);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.stats>div{padding:16px 6px 14px;text-align:center;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats svg{width:26px;height:26px;color:#fff;margin-bottom:6px}
.stats b{display:block;font-size:var(--fs-xl);font-weight:700;color:#fff;line-height:1;white-space:nowrap}
.stats span{display:block;font-size:var(--fs-sm);color:var(--mist);margin-top:5px;line-height:1.15}

/* fish cards */
.fcard{position:relative;border-radius:16px;overflow:hidden;background:var(--navy-800);border:1px solid var(--line-2);display:flex;flex-direction:column}
.fcard .art{aspect-ratio:1/1;position:relative;background:linear-gradient(180deg,#1b4468,#0d2238)}
.fcard .art svg,.fcard .art img{width:100%;height:100%;object-fit:cover;display:block}
.fcard .art .chk{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.fcard .art .chk svg{width:14px;height:14px;color:#062}
.fcard .art .tiertag{position:absolute;top:8px;left:8px}
.fcard .art .fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(7,17,29,.55);display:grid;place-items:center;color:#fff}
.fcard .art .fav svg{width:18px;height:18px}
.fcard .art .fav.on{color:#ff4d5e}
.fcard .body{padding:10px 11px 11px}
.fcard .name{font-weight:600;font-size:var(--fs-md);color:#fff;line-height:1.2}
.fcard .name.caps{text-transform:uppercase;letter-spacing:.02em;font-size:var(--fs-md)}
.fcard .meta{display:flex;align-items:center;gap:6px 8px;margin-top:6px;color:var(--mist);font-size:var(--fs-xs);flex-wrap:wrap}
.fcard .tier{font-size:var(--fs-micro);padding:3px 7px;letter-spacing:.04em;max-width:100%}
.fcard .tier svg{display:none}
.fcard .meta svg{width:12px;height:12px;vertical-align:-2px;margin-right:3px}
.fcard .arrow{position:absolute;right:10px;bottom:12px;color:#fff;opacity:.8}
.fcard .arrow svg{width:18px;height:18px}
.fcard.sil .art{filter:saturate(.5)}
.fcard.sil .name{color:var(--ice)}
.fcard.sil .meta{color:var(--fog)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:var(--fs-sm);font-weight:600;color:var(--mist)}
.inp{width:100%;padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:#fff}
.inp:focus{border-color:var(--water-2)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
textarea.inp{min-height:80px;resize:vertical}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:var(--fs-sm);font-weight:600;color:var(--mist)}
.seg button.on{background:#1e76d9;color:#fff}
.toggle{width:52px;height:30px;border-radius:30px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:#2fc06a}
.toggle.on::after{left:25px}
.listrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
.listrow .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:#fff;flex:none}
.listrow .ic svg{width:20px;height:20px}
.listrow .t{font-weight:600;color:#fff;font-size:var(--fs-base)}
.listrow .s{color:var(--mist);font-size:var(--fs-sm);margin-top:2px}
.listrow>svg.chev{width:18px;height:18px;color:var(--mist)}

/* sheet / modal */
.sheet-bg{position:fixed;inset:0;background:rgba(3,9,16,.6);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;max-height:88dvh;overflow:auto;background:var(--navy-900);border-radius:22px 22px 0 0;border:1px solid var(--line-2);padding:10px 18px calc(18px + var(--safe-b));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin:4px auto 14px}
.sheet h3{font-family:var(--serif);font-size:var(--fs-xl);color:#fff;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translateX(-50%);background:#eaf3ff;color:#0b1a2b;padding:11px 16px;border-radius:12px;font-weight:600;font-size:var(--fs-md);z-index:90;box-shadow:var(--shadow);animation:up .25s;max-width:90%;text-align:center}

/* home */
.hero-quote{font-family:var(--script);font-size:var(--fs-2xl);color:#fff;text-align:center;opacity:.95;padding:6px 0 4px}
.hero-quote i{display:block;width:34px;height:2px;background:#fff;margin:4px auto 0;opacity:.7}
.level-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.badge-hex{width:74px;height:82px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.badge-hex svg.shape{position:absolute;inset:0;width:100%;height:100%}
.badge-hex .n{position:relative;font-family:var(--serif);font-weight:700;font-size:var(--fs-2xl);color:#fff;line-height:1}
.badge-hex .f{position:relative;color:#fff;width:20px;height:20px;display:block}
.lvl h3{font-size:var(--fs-2xl);font-weight:700;color:#fff;line-height:1}
.lvl .title{font-style:italic;color:var(--mist);margin-top:2px}
.lvl .xp{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;font-size:var(--fs-sm);color:var(--ice)}
.tile{border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);padding:12px;display:flex;align-items:center;gap:12px}
.tile .ic{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#fff;flex:none}
.tile .ic svg{width:22px;height:22px}
.tile{min-width:0}.tile>div{min-width:0}.tile>svg.chev{width:18px;height:18px;flex:none;color:#fff}.tile b{display:block;color:#fff;font-size:var(--fs-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{display:block;font-size:var(--fs-xs);color:var(--mist);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

/* registry */
.reg-head{display:grid;grid-template-columns:1fr auto;gap:12px}
.reg-head .big{font-family:var(--serif);font-size:var(--fs-display);font-weight:700;color:#fff;line-height:1}
.reg-head .big small{font-size:var(--fs-2xl);opacity:.8}
.reg-head .lbl{font-size:var(--fs-2xl);color:var(--ice);margin-top:-2px}
.reg-head .chal{width:150px;border:1px solid var(--line-2);border-radius:14px;background:rgba(255,255,255,.05);padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.reg-head .chal .hexi{width:56px;height:62px}
.reg-head .chal b{font-size:var(--fs-base);color:#fff;line-height:1.2}
.reg-head .chal span{font-size:var(--fs-sm);color:var(--ice)}
.reg-head .chal svg.chev{position:absolute;right:8px;bottom:8px;width:16px;height:16px;color:#fff}

/* verdict */
.verdict .hero{border-radius:20px;overflow:hidden;position:relative;aspect-ratio:4/3;background:#0d2238;border:1px solid var(--line-2)}
.verdict .hero>img,.verdict .hero>svg,.verdict .hero>span>img,.verdict .hero>span>svg{width:100%;height:100%;object-fit:cover}
.verdict .hero .vp{position:absolute;top:12px;right:12px}
.v-reveal{opacity:0;transform:translateY(14px) scale(.98);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.v-reveal.in{opacity:1;transform:none}
.v-species{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch;margin-top:14px}
.v-species h2{font-family:var(--serif);font-size:var(--fs-3xl);font-weight:700;color:#fff;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.v-species .sci{font-style:italic;color:var(--mist);margin-top:4px}
.v-tier{min-width:150px;border-radius:16px;padding:14px 12px;text-align:center;border:1px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden}
.v-tier.common{background:linear-gradient(180deg,rgba(138,151,168,.22),rgba(138,151,168,.08));border-color:rgba(138,151,168,.5)}
.v-tier.uncommon{background:linear-gradient(180deg,rgba(61,220,132,.24),rgba(61,220,132,.06));border-color:rgba(61,220,132,.5)}
.v-tier.rare{background:linear-gradient(180deg,rgba(59,139,255,.28),rgba(59,139,255,.08));border-color:rgba(59,139,255,.55)}
.v-tier.epic{background:linear-gradient(180deg,rgba(180,92,255,.32),rgba(180,92,255,.08));border-color:rgba(180,92,255,.6)}
.v-tier.legendary{background:linear-gradient(180deg,rgba(242,182,74,.34),rgba(242,182,74,.08));border-color:rgba(242,182,74,.65)}
.v-tier .nm{font-size:var(--fs-xl);font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.v-tier .nm svg{width:22px;height:22px}
.v-tier .stars{color:var(--gold);font-size:var(--fs-lg);letter-spacing:2px}
.v-tier .why{font-size:var(--fs-sm);color:var(--ice);opacity:.9}
.v-tier.legendary::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.35) 80%,transparent 90%);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.v-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;background:var(--glass);border:1px solid var(--line-2);border-radius:16px;overflow:hidden}
.v-stats>div{padding:14px 10px;border-right:1px solid var(--line)}
.v-stats>div:last-child{border-right:0}
.v-stats .k{font-size:var(--fs-xs);letter-spacing:.12em;color:var(--mist);font-weight:600;display:flex;align-items:center;gap:6px}
.v-stats .k svg{width:14px;height:14px}
.v-stats .v{font-size:var(--fs-xl);font-weight:700;color:#fff;margin-top:6px;line-height:1}
.v-stats .s{font-size:var(--fs-xs);color:var(--mist);margin-top:4px}
.v-rowb{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}
.banner{display:inline-flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid;font-weight:700;letter-spacing:.06em;font-size:var(--fs-sm);text-transform:uppercase}
.banner.gold{background:rgba(242,182,74,.14);border-color:rgba(242,182,74,.5);color:#ffd985}
.banner.xp{background:rgba(61,220,132,.12);border-color:rgba(61,220,132,.5);color:#5cf0a0;letter-spacing:0;font-size:var(--fs-lg)}
.banner svg{width:20px;height:20px}
.xpc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid currentColor;font-size:var(--fs-micro);font-weight:800}
.v-reg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:14px;color:var(--ice)}
.v-reg svg{width:20px;height:20px;vertical-align:-4px;margin-right:8px}
.v-reg a{color:#fff;font-weight:500}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:drop 1.8s ease-in forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}

/* camera */
.cam-wrap{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.cam-wrap video,.cam-wrap canvas.prev,.cam-wrap img.prev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-top{position:relative;z-index:2;padding:calc(12px + var(--safe-t)) 16px 8px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);display:flex;align-items:center;gap:10px}
.cam-top .brand{display:flex;align-items:center;gap:8px;flex:1;justify-content:center}
.cam-top .brand svg{width:34px;height:34px}
.cam-top .brand b{font-family:var(--serif);font-size:var(--fs-xl);color:#fff}
.cam-top .x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff}
.cam-top .x svg{width:20px;height:20px}
.cam-title{position:relative;z-index:2;text-align:center;color:#fff;padding:0 16px}
.cam-title h1{font-family:var(--serif);font-size:var(--fs-2xl)}
.cam-title p{margin:2px 0 0;opacity:.9;font-size:var(--fs-md)}
.cam-match{position:relative;z-index:2;margin:12px 16px 0;background:rgba(7,17,29,.78);border:1px solid var(--line-2);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(10px)}
.cam-match .mini{width:64px;height:40px;border-radius:8px;overflow:hidden;background:#123;flex:none}
.cam-match .mini svg{width:100%;height:100%}
.cam-match small{display:block;color:var(--mist);font-size:var(--fs-sm)}
.cam-match b{font-size:var(--fs-lg);color:#fff}
.cam-match b em{font-style:normal;color:var(--water-2);margin-left:8px}
.cam-match svg.chev{width:18px;height:18px;color:#fff;margin-left:auto}
.cam-frame{position:absolute;inset:0;z-index:1;pointer-events:none}
.cam-frame i{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.9}
.cam-frame i:nth-child(1){top:33%;left:8%;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.cam-frame i:nth-child(2){top:33%;right:8%;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.cam-frame i:nth-child(3){bottom:34%;left:8%;border-right:0;border-top:0;border-radius:0 0 0 6px}
.cam-frame i:nth-child(4){bottom:34%;right:8%;border-left:0;border-top:0;border-radius:0 0 6px 0}
.cam-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:31%;z-index:2;background:rgba(7,17,29,.82);border:1px solid var(--line-2);border-radius:999px;padding:9px 16px;display:flex;align-items:center;gap:10px;color:#fff;white-space:nowrap}
.cam-hint svg{width:20px;height:20px}
.cam-hint b{display:block;font-size:var(--fs-md)}
.cam-hint span{display:block;font-size:var(--fs-xs);color:var(--mist)}
.cam-bottom{margin-top:auto;position:relative;z-index:2;background:linear-gradient(180deg,rgba(7,17,29,.62),rgba(7,17,29,.94) 24%,#07111d);padding:26px 16px calc(16px + var(--safe-b))}
.cam-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cam-opts button{background:rgba(255,255,255,.06);border:1px solid var(--line-2);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;text-align:left}
.cam-opts button.ok{border-color:rgba(61,220,132,.5)}
.cam-opts svg{width:22px;height:22px;color:#fff;flex:none}
.cam-opts b{display:block;font-size:var(--fs-sm);color:#fff}
.cam-opts span{display:block;font-size:var(--fs-xs);color:var(--mist)}
.cam-opts button.ok span{color:var(--uncommon)}
.cam-ctl{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;gap:6px}
.cam-ctl .ib{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:var(--fs-sm)}
.cam-ctl .ib .sq{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line-2);display:grid;place-items:center}
.cam-ctl .ib svg{width:22px;height:22px}
.cam-ctl .ib small{color:var(--mist);font-size:var(--fs-xs)}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center;background:transparent;margin:0 8px}
.shutter i{width:58px;height:58px;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active i{transform:scale(.88)}
.cam-mode{display:flex;justify-content:center;margin-top:14px}
.cam-mode div{background:rgba(255,255,255,.08);border-radius:999px;padding:4px;display:flex}
.cam-mode span{padding:7px 22px;border-radius:999px;font-size:var(--fs-sm);font-weight:700;letter-spacing:.08em;color:var(--mist)}
.cam-mode span.on{background:rgba(31,122,224,.35);color:#8ec6ff}
.review-photo{border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:#0d2238;border:1px solid var(--line-2)}
.review-photo img{width:100%;height:100%;object-fit:cover}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite;display:inline-block}

/* feed */
.post{border-radius:18px;background:var(--glass);border:1px solid var(--line-2);overflow:hidden}
.post .ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post .ph .av{width:42px;height:42px;border-radius:50%;background:var(--navy-600);display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden}
.post .ph .av img{width:100%;height:100%;object-fit:cover}
.post .ph b{display:block;color:#fff;font-size:var(--fs-base)}
.post .ph small{color:var(--mist);font-size:var(--fs-sm)}
.post .ph .follow{padding:7px 14px;border-radius:999px;border:1px solid var(--water-2);color:#8ec6ff;font-weight:600;font-size:var(--fs-sm)}
.post .ph .follow.on{background:#1e76d9;color:#fff;border-color:transparent}
.post .pic{position:relative;aspect-ratio:4/3;margin:0 10px;border-radius:14px;overflow:hidden;background:#0d2238}
.post .pic>img,.post .pic>svg,.post .pic>span>img,.post .pic>span>svg{width:100%;height:100%;object-fit:cover}
.post .pic .tiertag{position:absolute;top:10px;right:10px}
.post .pic .cap{position:absolute;left:12px;bottom:12px;color:#fff}
.post .pic .cap b{display:block;font-size:var(--fs-xl);letter-spacing:.02em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.post .pic .cap i{font-size:var(--fs-sm);opacity:.9;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.post .pic .mm{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.post .pic .mm span{background:rgba(7,17,29,.72);border:1px solid var(--line-2);padding:6px 10px;border-radius:10px;font-weight:600;font-size:var(--fs-sm);color:#fff}
.post .txt{padding:12px 14px 4px;color:#fff;font-size:var(--fs-md)}
.post .txt .h{color:#8ec6ff}
.post .acts{display:flex;align-items:center;gap:20px;padding:10px 14px 12px;border-top:1px solid var(--line);margin-top:8px;color:#fff;font-size:var(--fs-md)}
.post .acts button{display:inline-flex;align-items:center;gap:7px;color:#fff}
.post .acts button svg{width:20px;height:20px}
.post .acts button.liked svg{color:#ff4d5e;fill:#ff4d5e}
.post .acts .share{margin-left:auto}

/* map */
#map{height:52vh;min-height:320px;border-radius:18px;border:1px solid var(--line-2);overflow:hidden;background:#0d2238;position:relative;z-index:1}
.leaflet-container{background:#0d2238;font-family:var(--sans)}
.leaflet-tile{filter:brightness(.78) saturate(.85) contrast(1.05)}
.fpin{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#0b1a2b;border:2px solid #fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.fpin svg{width:18px;height:18px;transform:rotate(45deg);color:#fff}
.fpin.epic{border-color:var(--epic)}.fpin.legendary{border-color:var(--legendary)}.fpin.rare{border-color:var(--rare)}.fpin.uncommon{border-color:var(--uncommon)}
.leaflet-popup-content-wrapper{background:var(--navy-900);color:#fff;border-radius:12px;border:1px solid var(--line-2)}
.leaflet-popup-tip{background:var(--navy-900)}
.leaflet-popup-content{margin:10px 12px;font-size:var(--fs-sm)}
.catchrow{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--glass);border:1px solid var(--line-2);border-radius:16px;padding:10px;position:relative}
.catchrow .im{border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:#0d2238}
.catchrow .im img,.catchrow .im svg{width:100%;height:100%;object-fit:cover}
.catchrow .w{font-weight:600;color:#fff;font-size:var(--fs-base);display:flex;justify-content:space-between;gap:6px}
.catchrow .w small{font-weight:400;color:var(--mist);font-size:var(--fs-sm)}
.catchrow .loc{color:var(--mist);font-size:var(--fs-sm);margin-top:2px}
.catchrow .sp{color:#fff;font-weight:600;font-size:var(--fs-base);margin-top:5px}
.catchrow .mm{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:var(--fs-sm);color:var(--ice);flex-wrap:wrap}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach>div{background:var(--glass);border:1px solid var(--line-2);border-radius:16px;padding:12px 8px;text-align:center;position:relative}
.ach .shield{width:70px;height:78px;margin:0 auto 8px}
.ach b{display:block;font-size:var(--fs-sm);color:#fff;line-height:1.2}
.ach span{display:block;font-size:var(--fs-xs);color:var(--mist);margin-top:3px;line-height:1.2}
.ach .chk{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.ach .chk svg{width:13px;height:13px;color:#062}
.ach>div.locked .shield{filter:grayscale(1) brightness(.6)}

/* standing */
.standing{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.standing .medal{display:flex;align-items:center;gap:10px}
.standing .medal svg{width:64px;height:76px;flex:none}
.standing .pct{font-family:var(--serif);font-size:var(--fs-3xl);font-weight:700;color:#fff;line-height:1}
.standing .pct small{display:block;font-family:var(--sans);font-size:var(--fs-base);font-weight:600;margin-top:2px}
.lb{border:1px solid var(--line-2);border-radius:14px;background:rgba(255,255,255,.04);overflow:hidden}
.lb .seg{margin:8px;padding:3px}
.lb .seg button{padding:7px 4px;font-size:var(--fs-sm)}
.lb .r{display:grid;grid-template-columns:22px 28px 1fr auto;align-items:center;gap:8px;padding:7px 10px;font-size:var(--fs-sm);color:#fff}
.lb .r .av{width:26px;height:26px;border-radius:50%;background:var(--navy-600);display:grid;place-items:center;font-size:var(--fs-micro);font-weight:700}
.lb .r.me{background:#1f6fd0;font-weight:700}
.lb .r span:last-child{color:var(--ice);font-size:var(--fs-sm)}

/* onboarding */
.onb{min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 22px calc(22px + var(--safe-b))}
.onb h1{font-family:var(--serif);font-size:var(--fs-display);color:#fff;line-height:1.05}
.onb p{color:var(--ice);opacity:.9;font-size:var(--fs-lg);margin:10px 0 0}
.onb .logo{width:96px;height:96px;margin-bottom:auto}
.dots{display:flex;gap:6px;margin:18px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:#fff;width:22px;border-radius:8px}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.loop span{padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);font-size:var(--fs-sm);font-weight:600;color:#fff;background:rgba(255,255,255,.06)}
.loop svg{width:14px;height:14px;color:var(--mist)}

.split{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv>div{background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:13px;padding:11px 12px}
.kv .k{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--mist);font-weight:600}
.kv .v{font-size:var(--fs-lg);font-weight:700;color:#fff;margin-top:4px}
.verify{display:flex;flex-direction:column;gap:6px}
.verify div{display:flex;align-items:center;gap:8px;font-size:var(--fs-md);color:var(--ice)}
.verify svg{width:16px;height:16px;color:var(--ok)}
.verify .no svg{color:var(--fog)}
.verify .no{color:var(--fog)}
.shot-photo{border-radius:20px;overflow:hidden;aspect-ratio:4/3;background:#0d2238;border:1px solid var(--line-2);position:relative}
.shot-photo>img,.shot-photo>svg,.shot-photo>span>img,.shot-photo>span>svg{width:100%;height:100%;object-fit:cover}
.shot-photo .tiertag{position:absolute;top:12px;left:12px}
.shot-photo .fav{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:rgba(7,17,29,.6);display:grid;place-items:center;color:#fff}
.shot-photo .fav svg{width:20px;height:20px}
.shot-photo .fav.on{color:#ff4d5e}
.shot-photo .fav.on svg{fill:#ff4d5e}
.hist{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hist .h{flex:none;width:110px;border-radius:12px;overflow:hidden;background:var(--navy-800);border:1px solid var(--line-2)}
.hist .h .im{aspect-ratio:1/1;background:#0d2238}
.hist .h .im img,.hist .h .im svg{width:100%;height:100%;object-fit:cover}
.hist .h div.t{padding:7px 8px;font-size:var(--fs-sm);color:#fff}
.hist .h div.t small{display:block;color:var(--mist);font-size:var(--fs-xs)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* ---------- Quality floor: focus, states, overlays ---------- */
::selection{background:rgba(59,160,255,.38);color:#fff}
:focus-visible{outline:2px solid #9fd0ff;outline-offset:2px;box-shadow:0 0 0 5px rgba(7,17,29,.92)}
@media (forced-colors:active){:focus-visible{outline:2px solid CanvasText;outline-offset:2px;box-shadow:none}}
::placeholder{color:var(--fog);opacity:1}
button:disabled{cursor:not-allowed}
.shutter:disabled{opacity:.4}
.btn[aria-busy="true"],.shutter[aria-busy="true"]{opacity:.7;pointer-events:none}
.back{min-width:40px;min-height:40px}
.toast:empty{display:none}
.fwrap{position:relative;display:flex;flex-direction:column}
.fwrap>.fcard{flex:1}
.tiertag .tier.common{background:linear-gradient(var(--common-bg),var(--common-bg)) rgba(7,17,29,.88)}
.tiertag .tier.uncommon{background:linear-gradient(var(--uncommon-bg),var(--uncommon-bg)) rgba(7,17,29,.88)}
.tiertag .tier.rare{background:linear-gradient(var(--rare-bg),var(--rare-bg)) rgba(7,17,29,.88)}
.tiertag .tier.epic{background:linear-gradient(var(--epic-bg),var(--epic-bg)) rgba(7,17,29,.88)}
.tiertag .tier.legendary{background:linear-gradient(var(--legendary-bg),var(--legendary-bg)) rgba(7,17,29,.88)}
.verdict .hero .vp{background:rgba(7,17,29,.78);border-color:rgba(255,255,255,.28)}
.post .pic .scrim{position:absolute;left:0;right:0;bottom:0;height:62%;pointer-events:none;background:linear-gradient(180deg,rgba(7,17,29,0),rgba(7,17,29,.72) 45%,rgba(7,17,29,.9))}
.cam-scrim{position:absolute;left:0;right:0;top:0;height:42%;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(3,9,16,.74),rgba(3,9,16,.62) 55%,rgba(3,9,16,0))}
button.cam-match{text-align:left;font:inherit;color:inherit}
.cam-match .mini{display:block}
.cam-match .cm-txt{display:block;flex:1;min-width:0}
.cam-match b{display:block}
.cam-mode span.off{opacity:.45}
.leaflet-container .leaflet-control-attribution a{color:#005c81}
.lb .r.me span:last-child{color:#fff}
.ach>div.locked b{color:var(--mist)}
@media (max-width:760px){input,select,textarea,select.chip{font-size:var(--fs-input)}}
/* ---------- Design pass: layout, hierarchy, imagery ---------- */
svg.chev{width:18px;height:18px;flex:none}
.seg button svg{width:15px;height:15px;vertical-align:-3px;margin-right:3px}
@media (max-width:380px){header.top .wm small{letter-spacing:.12em}}
.page-h.std{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t t" "s g";align-items:start;column-gap:14px}
.page-h.std>div:first-child{display:contents}
.page-h.std h1{grid-area:t}
.page-h.std p{grid-area:s;margin-top:6px}
.page-h.std .tag{grid-area:g;margin-top:8px}
.page-h p,.centerh p{text-wrap:balance}
.map-priv{margin:-6px 0 12px}
.post .pic .pic-foot{position:absolute;left:12px;right:10px;bottom:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.post .pic .pic-foot .cap,.post .pic .pic-foot .mm{position:static}
.post .pic .pic-foot .cap{min-width:0;flex:1}
.post .pic .pic-foot .cap i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .pic .pic-foot .mm{flex:none}

.tile b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.reg-head .lbl{margin-top:6px;line-height:1.1}
.v-rowb>div{display:flex}
.v-rowb .banner{flex:1}
.v-rowb .banner.xp{justify-content:center}
.v-reg>span{min-width:0}
.v-reg a{white-space:nowrap}
.verdict .hero.t-uncommon{border-color:rgba(61,220,132,.45)}
.verdict .hero.t-rare{border-color:rgba(59,139,255,.55);box-shadow:0 18px 44px -18px rgba(59,139,255,.55)}
.verdict .hero.t-epic{border-color:rgba(180,92,255,.6);box-shadow:0 18px 48px -16px rgba(180,92,255,.6)}
.verdict .hero.t-legendary{border-color:rgba(242,182,74,.7);box-shadow:0 18px 52px -14px rgba(242,182,74,.6)}
.th-card{padding:0;overflow:hidden}
.th-img{position:relative;aspect-ratio:16/9;background:#0d2238}
.th-img>span:first-child{display:block;width:100%;height:100%}
.th-img>span:first-child>img,.th-img>span:first-child>svg{width:100%;height:100%;object-fit:cover;display:block}
.th-img .tiertag{position:absolute;top:10px;left:10px}
.th-pb{position:absolute;top:10px;right:10px;padding:5px 10px;border-radius:999px;background:rgba(7,17,29,.82);border:1px solid rgba(242,182,74,.55);color:#ffd985;font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.th-body{padding:12px 16px 14px}
.th-name{font-family:var(--serif);font-size:var(--fs-2xl);font-weight:700;color:#fff;margin-top:4px;line-height:1.15}
.th-body .mm{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:var(--fs-md);color:var(--ice)}
.th-body .loc{color:var(--mist);font-size:var(--fs-sm);margin-top:4px}
.nt-art{width:96px;height:64px;border-radius:12px;overflow:hidden;flex:none;border:1px solid var(--line-2)}
.nt-art svg,.sd-art svg{width:100%;height:100%;display:block}
.sd-art{aspect-ratio:16/9;background:#0b2233}
.cam-top{order:0}.cam-title{order:1}.cam-match{order:2}
.cam-frame{position:relative;inset:auto;order:3;flex:1;min-height:110px;margin:16px 9% 12px}
.cam-frame i:nth-child(1){top:0;left:0}.cam-frame i:nth-child(2){top:0;right:0}.cam-frame i:nth-child(3){bottom:0;left:0}.cam-frame i:nth-child(4){bottom:0;right:0}
.cam-hint{position:relative;left:auto;bottom:auto;transform:none;order:4;align-self:center;margin:0 0 12px}
.cam-bottom{order:5;margin-top:0}
.cam-opts button{flex-direction:column;align-items:flex-start;gap:6px;padding:10px 10px 9px}
.cam-opts b{line-height:1.2}
.tiles{grid-template-columns:1fr}
nav.bottom button{white-space:nowrap;font-size:var(--fs-xs)}
.reg-head .big{line-height:1.12}
.no-cam .cam-frame,.no-cam .cam-hint{visibility:hidden}
/* ---------- Light header (mock direction): navy type on the sky band, cards stay navy ---------- */
header.top .brand svg{color:#163a56}
.cam-top .brand svg{color:#e8f2ff}
.onb .logo{color:#163a56}
.page-h button.lnk{color:var(--hdr)}
.hbtn{width:40px;height:40px;border-radius:10px;background:rgba(11,26,43,.08);border:1px solid rgba(11,26,43,.14);color:var(--hdr);display:grid;place-items:center}
.map-priv .pill{background:rgba(13,29,48,.9)}
.pf-avatar{width:96px;height:96px;border-radius:50%;background:var(--navy-600);border:3px solid rgba(11,26,43,.3);display:grid;place-items:center;font-family:var(--serif);font-size:var(--fs-display);font-weight:700;color:#fff;flex:none}
.pf-name{font-family:var(--serif);font-size:var(--fs-3xl);font-weight:700;color:var(--hdr);line-height:1}
.pf-loc{color:var(--hdr)}
.pf-quote{color:var(--hdr-2);font-style:italic}
.pf-tag{font-family:var(--script);font-weight:600;font-size:var(--fs-xl);color:var(--hdr);transform:rotate(-4deg);text-align:right;white-space:nowrap}
.onb{background:linear-gradient(180deg,rgba(7,17,29,0) 0px,rgba(7,17,29,0) 120px,rgba(7,17,29,.9) 225px,var(--navy-950) 330px)} /* onboarding copy is bottom-anchored: on a short phone it starts near y 230, so the panel carries its own navy */

// Photos live in IndexedDB as blobs (real captures) or as small SVG strings (demo art)
const DB = {
  db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('fishhunt',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('photos')};r.onsuccess=e=>{this.db=e.target.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async del(k){const db=await this.open();return new Promise((res)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').delete(k);t.oncomplete=res;t.onerror=res})},
  async clear(){const db=await this.open();return new Promise((res)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').clear();t.oncomplete=res;t.onerror=res})}
};
const urlCache=new Map();
async function photoURL(c){ // returns an object URL / data URL for a catch photo
  if(!c)return null;
  if(c.art)return null; // rendered inline
  if(urlCache.has(c.id))return urlCache.get(c.id);
  try{const b=await DB.get(c.id);if(b){const u=URL.createObjectURL(b);urlCache.set(c.id,u);return u}}catch(e){}
  return null;
}
async function photoEl(c,cls=''){ // html for the catch image
  const u=await photoURL(c);
  if(u)return `<img src="${u}" alt="${esc(SP[c.sp]?.n||'catch')}" class="${cls}">`;
  return fishScene(SP[c.sp],c.id);
}
// fill elements marked data-photo=<catchId> asynchronously
async function hydratePhotos(root=document){
  for(const el of $$('[data-photo]',root)){const c=S.catches.find(x=>x.id===el.dataset.photo)||CUR.catch;if(!c)continue;el.innerHTML=await photoEl(c);el.removeAttribute('data-photo')}
}

/* ---------- Engine: tiers, XP, levels ---------- */
function normCDF(z){const t=1/(1+.2316419*Math.abs(z));const d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function topPct(sp,len){ if(!sp||!len)return null; const sd=Math.max(1,(sp.tro-sp.typ)/2); const z=(len-sp.typ)/sd; return clamp(Math.round((1-normCDF(z))*100),1,99) }
function sizePts(pct){ if(pct==null)return 0; if(pct<=2)return 70; if(pct<=8)return 55; if(pct<=15)return 40; if(pct<=30)return 25; if(pct<=50)return 10; return 0 }
function tierFor(sp,len,pb){ const base=(sp?.r||1)*20; const score=base+sizePts(topPct(sp,len))+(pb?10:0); const t = score>=130?'legendary':score>=90?'epic':score>=60?'rare':score>=40?'uncommon':'common'; return {tier:t,score} }
function levelFor(xp){let L=1;while(xpForLevel(L+1)<=xp)L++;return L}
function xpForLevel(L){return Math.round(120*(L-1)*(L-1)+80*(L-1))} // cumulative XP required to reach level L
function levelTitle(L){let t=LEVEL_TITLES[0][1];for(const [l,n] of LEVEL_TITLES){if(L>=l)t=n}return t}
function levelInfo(){const L=levelFor(S.xp);const a=xpForLevel(L),b=xpForLevel(L+1);return {L,title:levelTitle(L),cur:S.xp-a,need:b-a,pct:Math.round((S.xp-a)/(b-a)*100)}}
function speciesCaught(){return new Set(S.catches.map(c=>c.sp))}
function pbFor(spId,excludeId){let best=null;for(const c of S.catches){if(c.sp!==spId||c.id===excludeId||!c.len)continue;if(!best||c.len>best.len)best=c}return best}
function challengeProgress(ch){const have=speciesCaught();return ch.sp.filter(s=>have.has(s)).length}

// Commit a reviewed catch: computes tier/xp/pb, updates state, evaluates achievements+challenges. Returns verdict object.
function commitCatch(draft){
  const sp=SP[draft.sp];
  const had=speciesCaught();const newSpecies=!had.has(sp.id);
  const prevPB=pbFor(sp.id);const pb=!!(draft.len&&prevPB&&draft.len>prevPB.len);
  const {tier,score}=tierFor(sp,draft.len,pb);
  const pct=topPct(sp,draft.len);
  const parts=[['Catch logged',XP.catch]];
  if(newSpecies)parts.push(['New species',XP.newSpecies]);
  if(pb)parts.push(['Personal best',XP.pb]);
  if(TIERS[tier].xp)parts.push([TIERS[tier].n+' catch',TIERS[tier].xp]);
  const c={id:draft.id||uid(),sp:sp.id,ts:draft.ts||Date.now(),lat:draft.lat??null,lng:draft.lng??null,privacy:draft.privacy||S.privacy,water:draft.water||'',region:draft.region||(regionFrom(draft.lat,draft.lng)||''),len:draft.len||null,wt:draft.wt||null,method:draft.method||'manual',tier,score,pct,pb,released:!!draft.released,caption:draft.caption||'',fav:false,aiConf:draft.aiConf??null,verified:{photo:!!draft.hasPhoto,species:draft.aiConf!=null,length:draft.method==='ai',time:true,location:draft.lat!=null},art:!!draft.art,createdAt:Date.now()};
  S.catches.unshift(c);
  const before={ach:new Set(Object.keys(S.achievements)),ch:new Set(Object.keys(S.challengesDone))};
  let xp=parts.reduce((a,p)=>a+p[1],0);
  const chDone=[];
  for(const ch of CHALLENGES){if(!S.challengesDone[ch.id]&&challengeProgress(ch)===ch.sp.length){S.challengesDone[ch.id]=Date.now();parts.push([ch.n+' complete',ch.xp]);xp+=ch.xp;chDone.push(ch)}}
  S.xp+=xp;c.xp=xp;
  const newAch=[];for(const a of ACHIEVEMENTS){if(!S.achievements[a.id]&&a.test(S)){S.achievements[a.id]=Date.now();newAch.push(a)}}
  for(const a of newAch)S.inbox.unshift({id:uid(),ts:Date.now(),k:'ach',t:'Achievement unlocked: '+a.n,s:a.d});
  for(const ch of chDone)S.inbox.unshift({id:uid(),ts:Date.now(),k:'ch',t:'Challenge complete: '+ch.n,s:'+'+ch.xp.toLocaleString()+' XP · '+ch.badge+' badge'});
  if(pb)S.inbox.unshift({id:uid(),ts:Date.now(),k:'pb',t:'New personal best · '+sp.n,s:num(c.len)+' in'});
  save();
  const chal=CHALLENGES.map(ch=>({ch,p:challengeProgress(ch)})).filter(x=>ch_has(x.ch,sp.id));
  return {c,sp,newSpecies,pb,prevPB,tier,pct,parts,xp,newAch,chDone,chal,registry:[speciesCaught().size,SPECIES.length]};
}

function shieldBadge(ico,color='#2d6fb8',locked=false){const c=locked?'#3a4a5a':color;return `<svg class="shield" aria-hidden="true" viewBox="0 0 70 78"><defs><linearGradient id="sh${ico}${locked?'l':''}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#b47a2a"/></linearGradient></defs><path d="M35 3 L65 13 V40 C65 58 50 70 35 75 C20 70 5 58 5 40 V13Z" fill="#102a44" stroke="url(#sh${ico}${locked?'l':''})" stroke-width="3"/><path d="M35 10 L58 18 V40 C58 54 47 63 35 68 C23 63 12 54 12 40 V18Z" fill="${c}" opacity=".35"/><g transform="translate(19 22) scale(1.35)" style="color:#fff">${sized(I[ico]||I.fish)}</g></svg>`}
const ACH_ICON={fish:'fish',salmon:'fish',trout:'fish',wave:'wave',tent:'mtn',map:'map',trophy:'trophy',mtn:'tree',star:'star',crown:'crown',release:'release',bolt:'bolt',medal:'medal'};
const ACH_COLOR={fish:'#2d6fb8',salmon:'#c65b7c',trout:'#3ddc84',wave:'#22c1c3',tent:'#2d6fb8',map:'#22c1c3',trophy:'#f2b64a',mtn:'#3ddc84',star:'#3b8bff',crown:'#f2b64a',release:'#22c1c3',bolt:'#f2b64a',medal:'#b45cff'};
function locLine(c,owner=true){ // what location text to show for a catch
  if(owner){ return [c.water,c.region].filter(Boolean).join(' · ')||'Location not set' }
  switch(c.privacy){case 'exact':case 'waterbody':return c.water||c.region||'Undisclosed';case 'region':return c.region||'Undisclosed';default:return 'Undisclosed water'}
}
function avatarLetter(){return (S.name||'A').trim()[0].toUpperCase()}
function pctLabel(){ // demo standing
  const all=DEMO_LEADERS.Local.map(x=>x[1]).concat([S.xp]).sort((a,b)=>b-a);const rank=all.indexOf(S.xp)+1;return Math.max(1,Math.round(rank/(all.length+40)*100))
}

/* ---------- Router ---------- */
const CUR={route:'home',params:{},catch:null,draft:null};
const ROUTES={};
function go(route,params={}){CUR.route=route;CUR.params=params;location.hash='#'+route+(params.id?'/'+params.id:'');render()}
let lastRoute=null,lastParams='',capReturn=null,lastH1='';
const KEY_ATTRS=['data-rf','data-tf','data-ft','data-lb','data-fav','data-priv','data-sp','data-rel','data-rp','data-alt','data-like','data-follow','data-share','data-del','data-copt','data-go','data-nav','data-pick'];
function focusKey(el){
  if(!el||el===document.body||!el.isConnected||el.tagName==='H1')return null;
  let sel=null;if(el.id)sel='#'+CSS.escape(el.id);else for(const a of KEY_ATTRS){if(el.hasAttribute(a)){sel=`[${a}="${CSS.escape(el.getAttribute(a))}"]`;break}}
  return sel?{sel,idx:[...document.querySelectorAll(sel)].indexOf(el)}:null;
}
function findKey(k){if(!k)return null;const all=[...document.querySelectorAll(k.sel)].filter(e=>e.getClientRects().length&&!e.closest('[inert]'));return all[k.idx]||all[0]||null}
function render(){
  const params=JSON.stringify(CUR.params||{});
  const sameRoute=lastRoute===CUR.route&&lastParams===params,prevRoute=lastRoute,prevFocus=focusKey(document.activeElement);
  closeSheets();
  if(prevRoute==='capture'&&CUR.route!=='capture')stopCamera(); // never leave the camera running behind another screen
  if(CUR.route==='capture'&&prevRoute!=='capture')capReturn=prevFocus;
  lastRoute=CUR.route;lastParams=params;
  const navKey={home:'home',explore:'explore',registry:'explore',species:'explore',map:'explore',challenges:'explore',feed:'explore',trophy:'trophy',catch:'trophy',more:'more',profile:'more',achievements:'more',settings:'more',inbox:'more'}[CUR.route];
  $$('#nav button').forEach(b=>{const on=b.dataset.nav===navKey;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#topbar').classList.toggle('hide',['capture','onboarding'].includes(CUR.route)); // before paint: focus restoration needs these visible
  document.body.dataset.hdr=CUR.route==='profile'?'profile':CUR.route==='onboarding'?'onb':['home','explore','trophy','feed','more','map'].includes(CUR.route)?'page':'center'; // where the sky hands over to the cards
  $('#nav').classList.toggle('hide',['capture','onboarding','review','verdict'].includes(CUR.route));
  const fn=ROUTES[CUR.route]||ROUTES.home;
  const v=$('#view');
  if(!sameRoute){v.scrollTop=0;window.scrollTo(0,0)} // re-renders of the same screen keep the reader's place
  const out=fn(CUR.params);
  const paint=h=>{v.innerHTML=h;after();settleFocus(sameRoute,prevRoute,prevFocus)};
  if(out instanceof Promise)out.then(paint);else paint(out);
  $('#avatarBtn').textContent=avatarLetter();
  const unread=S.inbox.filter(i=>!i.read).length;$('#inboxDot').hidden=!unread;$('#topbar [data-go="inbox"]').setAttribute('aria-label',unread?`Notifications, ${unread} unread`:'Notifications');
}
function settleFocus(sameRoute,prevRoute,prevFocus){
  const h1=$('#view h1');if(h1&&!h1.hasAttribute('tabindex'))h1.tabIndex=-1;
  const h1t=h1?h1.textContent.trim():'';
  document.title=(h1&&!['home','onboarding'].includes(CUR.route)?h1t+' · ':'')+'Fish Hunt';
  if(sameRoute&&h1t&&h1t!==lastH1)announce(h1t);lastH1=h1t;
  if(CUR.route==='capture')return; // the camera dialog places its own focus
  let t=null;
  if(sameRoute){if(!prevFocus)return;t=findKey(prevFocus)||h1}
  else{if(prevRoute===null)return;if(prevRoute==='capture'&&capReturn){t=findKey(capReturn);capReturn=null}t=t||h1}
  if(t)t.focus({preventScroll:true});
}
function after(){hydratePhotos();enhance($('#view'));const f=CUR.after;if(f){CUR.after=null;f()}}
window.addEventListener('hashchange',()=>{const [r,id]=location.hash.slice(1).split('/');if(r&&r!==CUR.route){CUR.route=ROUTES[r]?r:'home';CUR.params=id?{id}:{};render()}});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();const [r,id]=g.dataset.go.split('/');go(r,id?{id}:{});return}
  const n=e.target.closest('[data-nav]');if(n){go(n.dataset.nav);return}
});
</script>
<script>
/* ===================== Fish Hunt — screens ===================== */
const tagline = `<div class="page-h"><div><h1 id="ph"></h1><p id="pp"></p></div><div class="tag">More fish.<br>Brighter days.</div></div>`;
function pageH(t,p,tag=true){return `<div class="page-h std"><div><h1>${t}</h1>${p?`<p>${p}</p>`:''}</div>${tag?'<div class="tag">More fish.<br>Brighter days.</div>':''}</div>`}
function quote(){return `<div class="hero-quote">More fish. Brighter days.<i></i></div>`}

/* ---------- Home ---------- */
ROUTES.home = ()=>{
  const li=levelInfo();const have=speciesCaught();
  const homeSp=SPECIES.filter(s=>!have.has(s.id)).sort((a,b)=>a.r-b.r||a.n.localeCompare(b.n));
  const next=homeSp[0];
  const chal=CHALLENGES.map(ch=>({ch,p:challengeProgress(ch)})).filter(x=>!S.challengesDone[x.ch.id]).sort((a,b)=>b.p/b.ch.sp.length-a.p/a.ch.sp.length)[0];
  const recent=[...S.catches].sort((a,b)=>TIER_ORDER.indexOf(b.tier)-TIER_ORDER.indexOf(a.tier)||b.ts-a.ts)[0];
  const first=S.catches.length===0;
  return `${pageH(`Welcome back${S.name?', '+esc(S.name.split(' ')[0]):''}`, first?'Your collection starts with one cast.':'Here is where your collection stands.')}
  <div class="stack">
    <div class="card">
      <div class="split"><span class="eyebrow">Registry progress</span><a data-go="registry" href="#registry" class="small b" style="color:#fff">View Registry ${I.arrow.replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')}</a></div>
      <div class="row" style="margin-top:10px;align-items:baseline"><span class="serif" style="font-size:var(--fs-display);font-weight:700;color:#fff;line-height:1">${have.size}<span style="font-size:var(--fs-2xl);opacity:.7"> / ${SPECIES.length}</span></span><span class="muted">species discovered</span></div>
      <div class="prog" style="margin-top:10px"><i style="width:${Math.round(have.size/SPECIES.length*100)}%"></i></div>
    </div>
    ${next?`<div class="card" data-go="species/${next.id}" aria-label="Next target: ${esc(next.n)}, ${TIERS[TIER_ORDER[next.r-1]].n}, plus ${(XP.catch+XP.newSpecies+TIERS[TIER_ORDER[next.r-1]].xp).toLocaleString()} XP for the discovery" style="cursor:pointer">
      <div class="split"><span class="eyebrow">Next target</span>${tierTag(TIER_ORDER[next.r-1])}</div>
      <div class="row" style="margin-top:10px"><div class="nt-art">${fishPlate(next,{k:'nt',sil:true})}</div><div class="grow"><b style="font-size:var(--fs-lg);color:#fff">${esc(next.n)}</b><div class="muted small" style="font-style:italic">${esc(next.sci)}</div><div class="small" style="margin-top:4px;color:#5cf0a0;font-weight:600">+${(XP.catch+XP.newSpecies+TIERS[TIER_ORDER[next.r-1]].xp).toLocaleString()} XP for the discovery</div></div>${I.chev.replace('class="chev"','style="width:20px;height:20px;color:#fff"')}</div>
    </div>`:''}
    ${chal?`<div class="card" data-go="challenges" aria-label="Current challenge: ${esc(chal.ch.n)}, ${chal.p} of ${chal.ch.sp.length}" style="cursor:pointer">
      <div class="split"><span class="eyebrow">Current challenge</span><span class="small b" style="color:#fff">${chal.p} / ${chal.ch.sp.length}</span></div>
      <b style="display:block;font-size:var(--fs-lg);color:#fff;margin-top:8px">${esc(chal.ch.n)}</b>
      <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:6px">${chal.ch.sp.map(id=>`<span class="pill" style="${have.has(id)?'border-color:rgba(61,220,132,.6);color:#5cf0a0':'opacity:.7'}">${have.has(id)?'✓ ':''}${esc(SP[id].n.replace(' Salmon','').replace(' Trout',''))}</span>`).join('')}</div>
      <div class="prog green" style="margin-top:12px"><i style="width:${Math.round(chal.p/chal.ch.sp.length*100)}%"></i></div>
    </div>`:''}
    ${recent?`<div class="card th-card" data-go="catch/${recent.id}" aria-label="Recent trophy: ${esc(SP[recent.sp].n)}, ${TIERS[recent.tier].n}${recent.len?', '+num(recent.len)+' inches':''}${recent.pb?', personal best':''}" style="cursor:pointer">
      <div class="th-img"><span data-photo="${recent.id}"></span><span class="tiertag">${tierTag(recent.tier)}</span>${recent.pb?'<span class="th-pb">Personal best</span>':''}</div>
      <div class="th-body"><span class="eyebrow">Recent trophy</span><div class="th-name">${esc(SP[recent.sp].n)}</div><div class="mm">${recent.len?`<span>${I.ruler.replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')} ${num(recent.len)} in</span>`:''}${recent.wt?`<span>${I.scale.replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')} ${num(recent.wt)} lb</span>`:''}<span>${fmtDate(recent.ts)}</span></div><div class="loc">${esc(locLine(recent))}</div></div>
    </div>`:`<div class="card" style="text-align:center;padding:26px 16px"><div style="width:64px;height:64px;margin:0 auto 10px;color:#fff">${I.cam}</div><b style="font-size:var(--fs-lg);color:#fff">Record your first catch</b><p class="muted" style="margin:6px 0 14px">Take a photo. Get the verdict. Start the collection.</p><button class="btn" data-nav="capture">${I.cam} Open camera</button></div>`}
    <div class="card level-card" data-go="profile" aria-label="Level ${li.L}, ${esc(li.title)}, ${li.cur.toLocaleString()} of ${li.need.toLocaleString()} XP" style="cursor:pointer">
      ${hexBadge(li.L)}
      <div class="lvl"><div class="eyebrow">Personal progress</div><h3 style="margin-top:4px">Level ${li.L}</h3><div class="title">${esc(li.title)}</div><div class="xp"><span>${li.cur.toLocaleString()} / ${li.need.toLocaleString()} XP</span><span class="muted">${S.xp.toLocaleString()} total</span></div><div class="prog"><i style="width:${li.pct}%"></i></div></div>
    </div>
    ${quote()}
  </div>`;
};

/* ---------- Explore hub ---------- */
ROUTES.explore = ()=>{
  const have=speciesCaught();
  const tiles=[
    ['registry','Species Registry',`${have.size} / ${SPECIES.length} discovered`,I.book],
    ['map','Catch Map',`${new Set(S.catches.map(c=>c.water).filter(Boolean)).size} waters fished`,I.map],
    ['challenges','Challenges',`${CHALLENGES.filter(c=>S.challengesDone[c.id]).length} / ${CHALLENGES.length} complete`,I.flag],
    ['feed','Community Feed','Real anglers. Real catches.',I.users],
    ['collections','Regional Collections','Salmon · Trout · Salt · Fresh',I.tree]
  ];
  return `${pageH('Explore','Registry, map, challenges and the feed.')}
  <div class="stack">${tiles.map(([r,t,s,ic])=>`<div class="card" data-go="${r}" style="cursor:pointer;padding:14px"><div class="listrow" style="padding:0;border:0"><div class="ic">${ic}</div><div class="grow"><div class="t">${t}</div><div class="s">${s}</div></div>${I.chev}</div></div>`).join('')}</div>`;
};
ROUTES.collections = ()=>{
  const have=speciesCaught();
  const groups=[['Salmon',s=>s.g==='salmon'],['Trout & Char',s=>['trout','char'].includes(s.g)],['Bass & Panfish',s=>['bass','panfish','walleye'].includes(s.g)],['Freshwater',s=>s.w==='fresh'],['Saltwater',s=>s.w==='salt'],['Anadromous',s=>s.w==='anadromous'],['Native species',s=>s.tags.includes('native')],['Trophy species',s=>s.tags.includes('trophy')]];
  return `<div class="centerh"><button class="back" data-go="explore">${I.back}</button><h1>Collections</h1><p>Complete a set. Earn the badge.</p></div>
  <div class="stack">${groups.map(([n,f])=>{const all=SPECIES.filter(f);const got=all.filter(s=>have.has(s.id)).length;return `<div class="card" data-go="registry" style="cursor:pointer"><div class="split"><b style="color:#fff;font-size:var(--fs-lg)">${n}</b><span class="small b" style="color:#fff">${got} / ${all.length}</span></div><div class="prog${got===all.length?' gold':''}" style="margin-top:10px"><i style="width:${Math.round(got/all.length*100)}%"></i></div></div>`}).join('')}</div>`;
};

/* ---------- Registry ---------- */
let regFilter='all', regSort='default';
ROUTES.registry = ()=>{
  const have=speciesCaught();
  const chal=CHALLENGES.map(ch=>({ch,p:challengeProgress(ch)})).filter(x=>!S.challengesDone[x.ch.id]).sort((a,b)=>b.p/b.ch.sp.length-a.p/a.ch.sp.length)[0]||{ch:CHALLENGES[0],p:challengeProgress(CHALLENGES[0])};
  const filters=[['all','All'],['salmon','Salmon'],['trout','Trout'],['bass','Bass & Panfish'],['fresh','Freshwater'],['salt','Saltwater'],['caught','Caught'],['missing','Not yet']];
  let list=SPECIES.filter(s=>{switch(regFilter){case 'salmon':return s.g==='salmon';case 'trout':return ['trout','char'].includes(s.g);case 'bass':return ['bass','panfish','walleye'].includes(s.g);case 'fresh':return s.w==='fresh';case 'salt':return s.w==='salt';case 'caught':return have.has(s.id);case 'missing':return !have.has(s.id);default:return true}});
  if(regSort==='az')list=[...list].sort((a,b)=>a.n.localeCompare(b.n));
  if(regSort==='rarity')list=[...list].sort((a,b)=>b.r-a.r);
  const pct=Math.round(have.size/SPECIES.length*100);
  return `<div class="centerh"><button class="back" data-go="explore">${I.back}</button><h1>Species Registry</h1><p>Track your catches. Complete the collection.</p><button id="regSort" aria-label="Sort species: ${({default:'Registry order',az:'A to Z',rarity:'Rarity'})[regSort]}" class="right hbtn">${I.sort.replace('<svg','<svg style="width:20px;height:20px"')}</button></div>
  <div class="card reg-head">
    <div><div class="big">${have.size}<small> / ${SPECIES.length}</small></div><div class="lbl">discovered</div><div class="row" style="margin-top:12px"><div class="prog grow"><i style="width:${pct}%"></i></div><span class="small b" style="color:#fff">${pct}%</span></div><div class="script" style="font-size:var(--fs-xl);color:var(--ice);margin-top:10px">“Different waters. A bigger story.”</div></div>
    <div class="chal" data-go="challenges" aria-label="${esc(chal.ch.n)}, ${chal.p} of ${chal.ch.sp.length}" style="cursor:pointer"><svg class="hexi" aria-hidden="true" viewBox="0 0 56 62"><path d="M28 2 L53 16 L53 46 L28 60 L3 46 L3 16Z" fill="#12283d" stroke="#3b8bff" stroke-width="2.5"/><g transform="translate(14 17) scale(1.2)" style="color:#fff">${sized(I.mtn)}</g></svg><b>${esc(chal.ch.n)}</b><span>${chal.p} / ${chal.ch.sp.length}</span>${I.chev}</div>
  </div>
  <div class="chips" style="margin-top:12px">${filters.map(([k,n])=>`<button class="chip ${regFilter===k?'on':''}" data-rf="${k}">${n}</button>`).join('')}</div>
  <div class="grid3" id="regGrid">${list.map(s=>regCard(s,have.has(s.id))).join('')}</div>
  ${quote()}`;
};
function regCard(s,got){
  const pb=got?pbFor(s.id):null;const first=got?[...S.catches].filter(c=>c.sp===s.id).sort((a,b)=>a.ts-b.ts)[0]:null;
  const bestTier=got?S.catches.filter(c=>c.sp===s.id).map(c=>c.tier).sort((a,b)=>TIER_ORDER.indexOf(b)-TIER_ORDER.indexOf(a))[0]:TIER_ORDER[s.r-1];
  return `<div class="fcard ${got?'':'sil'}" data-go="species/${s.id}" aria-label="${esc(s.n)}, ${got?'caught':'not yet caught'}, ${TIERS[bestTier].n}${pb?', personal best '+num(pb.len)+' inches':''}${first?', first caught '+fmtDate(first.ts):''}"><div class="art">${fishPlate(s,{sil:!got,k:'r'})}${got?`<span class="chk">${I.check}</span>`:''}</div><div class="body"><div class="name">${esc(s.n)}</div><div style="margin-top:6px">${tierTag(bestTier)}</div><div class="meta">${got?`<span>${I.ruler}${pb?num(pb.len)+' in':'—'}</span><span>${I.cal}${first?new Date(first.ts).toLocaleDateString('en-US',{month:'short',year:'numeric'}):''}</span>`:'<span>Not yet caught</span>'}</div></div></div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-rf]');if(b){regFilter=b.dataset.rf;render()}if(e.target.closest('#regSort')){regSort=regSort==='default'?'az':regSort==='az'?'rarity':'default';toast('Sorted: '+({default:'Registry order',az:'A → Z',rarity:'Rarity'}[regSort]));render()}});

/* ---------- Species detail ---------- */
ROUTES.species = ({id})=>{
  const s=SP[id];if(!s)return ROUTES.registry();
  const mine=S.catches.filter(c=>c.sp===id).sort((a,b)=>b.ts-a.ts);const got=mine.length>0;
  const pb=pbFor(id);const first=[...mine].sort((a,b)=>a.ts-b.ts)[0];
  const bestTier=got?mine.map(c=>c.tier).sort((a,b)=>TIER_ORDER.indexOf(b)-TIER_ORDER.indexOf(a))[0]:null;
  const inCh=CHALLENGES.filter(ch=>ch.sp.includes(id));
  return `<div class="centerh"><button class="back" data-go="registry">${I.back}</button><h1>${esc(s.n)}</h1><p style="font-style:italic">${esc(s.sci)}</p></div>
  <div class="card" style="padding:0;overflow:hidden"><div class="sd-art">${fishPlate(s,{sil:!got,k:'d'})}</div>
    <div style="padding:14px 16px"><div class="split"><span class="eyebrow">Status</span>${got?`<span class="pill" style="border-color:rgba(61,220,132,.6);color:#5cf0a0">${I.check} Discovered</span>`:`<span class="pill" style="opacity:.8">${I.lock} Not yet caught</span>`}</div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:6px"><span class="pill">${GROUP_LABEL[s.g]}</span><span class="pill">${s.w==='fresh'?'Freshwater':s.w==='salt'?'Saltwater':'Anadromous'}</span>${tierTag(TIER_ORDER[s.r-1])}${s.tags.includes('protected')?'<span class="pill" style="border-color:rgba(255,93,108,.5);color:#ff8c98">Release only</span>':''}${s.tags.includes('native')?'<span class="pill">Native</span>':''}</div>
    <p class="muted small" style="margin:12px 0 0">Typical ${s.typ} in · Trophy ${s.tro}+ in. ${s.r>=4?'A hard-to-find species — any verified catch starts at Rare or better.':'Size drives the tier: a fish past the trophy mark can reach Epic or Legendary.'}</p></div></div>
  ${got?`<div class="kv" style="margin-top:12px"><div><div class="k">Personal best</div><div class="v">${pb?num(pb.len)+' in':'—'}</div></div><div><div class="k">Total caught</div><div class="v">${mine.length}</div></div><div><div class="k">First caught</div><div class="v" style="font-size:var(--fs-md)">${fmtDateLong(first.ts)}</div></div><div><div class="k">Best catch tier</div><div class="v">${tierTag(bestTier)}</div></div></div>
  <div class="sub-h"><h2 class="sans">Your catch history</h2></div>
  <div class="stack">${mine.map(c=>catchRow(c)).join('')}</div>`:
  `<div class="card" style="margin-top:12px;text-align:center"><b style="color:#fff;font-size:var(--fs-lg)">Worth ${(XP.catch+XP.newSpecies+TIERS[TIER_ORDER[s.r-1]].xp).toLocaleString()}+ XP</b><p class="muted small" style="margin:6px 0 12px">Discovering a new species pays out on top of the catch itself.</p><button class="btn" data-nav="capture">${I.cam} Record a catch</button></div>`}
  ${inCh.length?`<div class="sub-h"><h2 class="sans">Part of</h2></div><div class="stack">${inCh.map(ch=>`<div class="card" data-go="challenges" style="cursor:pointer;padding:12px 16px"><div class="split"><b style="color:#fff">${esc(ch.n)}</b><span class="small b" style="color:#fff">${challengeProgress(ch)} / ${ch.sp.length}</span></div></div>`).join('')}</div>`:''}`;
};
