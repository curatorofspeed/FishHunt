function achCard(a,got){const [p,t]=a.p(S);return `<div class="${got?'':'locked'}" data-ach="${a.id}">${shieldBadge(ACH_ICON[a.ico]||'fish',ACH_COLOR[a.ico]||'#2d6fb8',!got)}<b>${esc(a.n)}</b><span>${esc(a.d)}</span>${got?`<span class="chk">${I.check}</span>`:`<div class="prog" style="height:5px;margin-top:8px"><i style="width:${Math.round(p/t*100)}%"></i></div><span class="tiny">${p} / ${t}</span>`}</div>`}
ROUTES.achievements = ()=>`<div class="centerh"><button class="back" data-go="profile">${I.back}</button><h1>Achievements</h1><p>${Object.keys(S.achievements).length} of ${ACHIEVEMENTS.length} unlocked</p></div><div class="ach">${ACHIEVEMENTS.map(a=>achCard(a,!!S.achievements[a.id])).join('')}</div>`;
ROUTES.inbox = ()=>{S.inbox.forEach(i=>i.read=true);save();const K={ach:I.trophy,ch:I.flag,pb:I.medal,sys:I.info};return `<div class="centerh"><button class="back" data-go="more">${I.back}</button><h1>Notifications</h1></div>${S.inbox.length?`<div class="card" style="padding:4px 16px">${S.inbox.map(i=>`<div class="listrow"><div class="ic">${K[i.k]||I.bell}</div><div class="grow"><div class="t">${esc(i.t)}</div><div class="s">${esc(i.s||'')} · ${ago(i.ts)}</div></div></div>`).join('')}</div>`:`<div class="card" style="text-align:center;padding:28px"><b style="color:#fff">Quiet for now</b><p class="muted small" style="margin:6px 0 0">Personal bests, achievements and challenge progress land here.</p></div>`}`};
ROUTES.settings = ()=>`<div class="centerh"><button class="back" data-go="more">${I.back}</button><h1>Settings</h1><p>Profile, privacy and data.</p></div>
  <div class="card stack"><span class="eyebrow">Profile</span>
    <div class="field"><label>Display name</label><input class="inp" id="setName" value="${esc(S.name)}" placeholder="Your name"></div>
    <div class="field"><label>Home region</label><select class="inp" id="setRegion">${REGIONS.map(r=>`<option ${S.homeRegion===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="field"><label>Home waters</label><input class="inp" id="setWaters" list="waters" value="${esc(S.homeWaters)}" placeholder="e.g. Lake Washington"></div>
  </div>
  <div class="card stack" style="margin-top:12px"><span class="eyebrow">Location privacy</span><p class="muted small" style="margin:0">Exact coordinates always stay on your device. This sets what new catches show to others.</p>
    <div class="seg" id="setPriv" aria-label="Default location privacy">${Object.entries(PRIVACY).map(([k,n])=>`<button data-sp="${k}" class="${S.privacy===k?'on':''}">${n.replace(' location','').replace(' only','')}</button>`).join('')}</div>
    <div class="small muted" id="privHelp" aria-live="polite">${privHelp(S.privacy)}</div>
  </div>
  <div class="card stack" style="margin-top:12px"><span class="eyebrow">Species identification</span><p class="muted small" style="margin:0">Without a key the camera runs in demo mode (you pick the species). Paste an Anthropic API key to identify fish from the photo with Claude vision. Developer preview only: the key is stored in this browser and calls go straight from the device.</p>
    <div class="field"><label>Anthropic API key</label><input class="inp" id="setKey" type="password" value="${esc(S.apiKey)}" placeholder="sk-ant-…" autocomplete="off"></div>
    <div class="field"><label>Model</label><input class="inp" id="setModel" value="${esc(S.model)}"></div>
  </div>
  <div class="card stack" style="margin-top:12px"><span class="eyebrow">Data</span>
    <div class="grid2"><button class="btn ghost sm" id="btnExport">${I.save} Export JSON</button><button class="btn ghost sm" id="btnImport">${I.image} Import JSON</button></div>
    <button class="btn ghost sm" id="btnDemo">${S.demo?'Remove sample catches':'Load sample catches'}</button>
    <button class="btn danger sm" id="btnWipe">${I.trash} Erase everything on this device</button>
  </div>
  <button class="btn" style="margin-top:14px" id="btnSaveSet">Save settings</button>
  <datalist id="waters">${WATERS.map(w=>`<option value="${esc(w)}">`).join('')}</datalist>`;
function privHelp(k){return {private:'Only you see where you fished. Catches stay out of the community feed.',region:'Others see a broad area like “Yakima River Region”.',waterbody:'Others see the water name, e.g. “Cle Elum Lake”, never the spot.',exact:'You choose to share the exact location on each catch.'}[k]}
document.addEventListener('click',async e=>{
  if(e.target.closest('#btnSaveSet')){S.name=$('#setName').value.trim();S.homeRegion=$('#setRegion').value;S.homeWaters=$('#setWaters').value.trim();S.apiKey=$('#setKey').value.trim();S.model=$('#setModel').value.trim()||'claude-opus-5';save();toast('Settings saved');go('profile');return}
  const sp=e.target.closest('[data-sp]');if(sp){S.privacy=sp.dataset.sp;save();$$('#setPriv button').forEach(b=>{const on=b.dataset.sp===S.privacy;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});$('#privHelp').textContent=privHelp(S.privacy);return}
  if(e.target.closest('#btnExport')){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),state:S},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fish-hunt-export.json';a.click();toast('Export started (photos stay on device)');return}
  if(e.target.closest('#btnImport')){$('#fileImport').click();return}
  if(e.target.closest('#btnDemo')){if(S.demo){if(await confirmSheet('Remove sample catches?','Your own recorded catches are kept.','Remove',true)){removeDemo();toast('Sample catches removed');render()}}else{seedDemo();toast('Sample catches loaded');go('home')}return}
  if(e.target.closest('#btnWipe')){if(await confirmSheet('Erase everything?','All catches, photos, XP and settings on this device are deleted.','Erase',true)){await DB.clear();localStorage.removeItem('fh:state');location.hash='';location.reload()}return}
});
$('#fileImport').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);const st=o.state||o;if(!Array.isArray(st.catches))throw 0;S=Object.assign({},DEFAULT,st);save();toast('Imported '+S.catches.length+' catches');go('home')}).catch(()=>toast('That file is not a Fish Hunt export'));e.target.value=''});

/* ---------- Onboarding ---------- */
let onbStep=0;
ROUTES.onboarding = ()=>{
  const logo=$('#topbar .brand svg').outerHTML.replace('<svg','<svg class="logo"');
  const steps=[
    `${logo}<h1>Every fish you catch becomes part of your collection.</h1><p>Fish Hunt is a registry of real catches. Take a photo, get the verdict, watch your collection grow.</p><div class="loop">${['Catch','Capture','Identify','Verdict','Collect','Progress'].map((s,i)=>`${i?I.chev:''}<span>${s}</span>`).join('')}</div>`,
    `${logo}<h1>Who's holding the rod?</h1><p>Your name goes on your trophy room and your standing.</p><div class="stack" style="margin-top:16px"><div class="field"><label>Name</label><input class="inp" id="onbName" value="${esc(S.name)}" placeholder="First name or handle" autocomplete="nickname"></div><div class="field"><label>Home region</label><select class="inp" id="onbRegion">${REGIONS.map(r=>`<option ${S.homeRegion===r?'selected':''}>${r}</option>`).join('')}</select></div></div>`,
    `${logo}<h1>Your spots stay yours.</h1><p>Fish Hunt stores the exact location of each catch on your device only. By default, nobody else sees where you fished. You can share a region or a water name later, catch by catch.</p><div class="card" style="margin-top:16px"><div class="split"><div><b id="onbDemoLbl" style="color:#fff">Start with sample catches</b><div class="muted small">See the app filled in. Remove them anytime in Settings.</div></div><button class="toggle ${onbDemo?'on':''}" id="onbDemo" role="switch" aria-checked="${onbDemo}" aria-labelledby="onbDemoLbl"></button></div></div>`
  ];
  return `<div class="onb">${steps[onbStep]}<div class="dots">${steps.map((_,i)=>`<i class="${i===onbStep?'on':''}"></i>`).join('')}</div><button class="btn" id="onbNext">${onbStep<2?'Continue':'Start collecting'}</button>${onbStep>0?`<button class="btn ghost" style="margin-top:10px" id="onbBack">Back</button>`:''}</div>`;
};
let onbDemo=true;
document.addEventListener('click',e=>{
  if(e.target.closest('#onbDemo')){onbDemo=!onbDemo;render();return}
  if(e.target.closest('#onbBack')){onbStep--;render();return}
  if(e.target.closest('#onbNext')){
    if(onbStep===1){S.name=$('#onbName').value.trim();S.homeRegion=$('#onbRegion').value;if(!S.name){toast('Add a name so we know who caught what');return}}
    if(onbStep<2){onbStep++;render();return}
    S.onboarded=true;if(onbDemo)seedDemo();save();go('home');
  }
});
</script>
<script>
/* ===================== Fish Hunt — capture → review → verdict ===================== */
let camStream=null, camGuess=null;
ROUTES.capture = ()=>{
  CUR.draft={id:uid(),ts:Date.now(),privacy:S.privacy,released:false};
  camGuess=null;
  const logo=$('#topbar .brand svg').outerHTML;
  CUR.after=()=>{updateCamOpts();$('#btnShutter')?.focus({preventScroll:true});startCamera()};
  return `<div class="cam-wrap" role="dialog" aria-modal="true" aria-labelledby="camTitle">
    <video id="camVideo" autoplay playsinline muted aria-hidden="true"></video>
    <div class="cam-scrim" aria-hidden="true"></div>
    <div class="cam-frame"><i></i><i></i><i></i><i></i></div>
    <div class="cam-top"><button class="back" data-go="home" style="color:#fff">${I.back}</button><div class="brand">${logo}<div><b>Fish Hunt</b><small style="display:block;font-size:9px;letter-spacing:.22em;color:var(--ice)">CATCH · EXPLORE · COLLECT</small></div></div><button class="x" data-go="home" aria-label="Close">${I.x}</button></div>
    <div class="cam-title"><h1 id="camTitle">Record Catch</h1><p>Take a clear photo of your catch</p></div>
    <button type="button" class="cam-match" id="camMatch"><span class="mini">${fishSVG(SP.coho,{k:'m'})}</span><span class="cm-txt"><small>${S.apiKey?'AI species ID after the shot':'Demo mode — confirm the species after the shot'}</small><b id="camMatchName">Choose species</b></span>${I.chev}</button>
    <div class="cam-hint">${I.target}<div><b>Align fish within the frame</b><span>Best results in good light</span></div>${I.info.replace('<svg','<svg style="width:18px;height:18px;color:var(--mist)"')}</div>
    <div class="cam-bottom">
      <div class="cam-opts"><button type="button" id="optAuto" data-copt="auto">${I.scan}<div><b>Auto-detect size</b><span id="optAutoLbl"></span></div></button><button type="button" id="optLen" data-copt="len">${I.ruler}<div><b>Add length</b><span id="optLenLbl">Optional</span></div></button><button type="button" id="optWt" data-copt="wt">${I.scale}<div><b>Add weight</b><span id="optWtLbl">Optional</span></div></button></div>
      <div class="cam-ctl"><button class="ib" id="btnGallery"><span class="sq">${I.image}</span>Gallery</button><button type="button" class="ib" id="btnFlash" disabled aria-pressed="false"><span class="sq">${I.bolt}</span>Flash<small id="flashLbl">Checking…</small></button><button class="shutter" id="btnShutter" aria-label="Take photo"><i></i></button><span></span><button class="ib" data-go="registry"><span class="sq">${I.book}</span>Species Guide</button></div>
      <div class="cam-mode" aria-hidden="true"><div><span class="on">PHOTO</span><span class="off" title="Video capture is not available yet">VIDEO</span></div></div>
    </div>
    <div id="camFallback" class="hide" style="position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#1b4468,#0d2238);z-index:1;text-align:center;padding:24px"><div><div style="width:64px;height:64px;margin:0 auto 12px;color:#fff">${I.cam}</div><b style="color:#fff;font-size:18px">Camera not available here</b><p class="muted" style="margin:6px 0 0">Use Gallery to import a photo, or open Fish Hunt on your phone.</p></div></div>
  </div>`;
};
async function startCamera(){
  const v=$('#camVideo');if(!v)return;
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('no media');
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false});
    if(CUR.route!=='capture'||!v.isConnected){stream.getTracks().forEach(t=>t.stop());return} // left while the permission prompt was open
    stopCamera();camStream=stream;v.srcObject=stream;initTorch();
    // Ask for location while the camera warms up (private by default, stored on device only)
    getPosition().then(p=>{if(p&&CUR.draft){CUR.draft.lat=p.lat;CUR.draft.lng=p.lng;CUR.draft.region=regionFrom(p.lat,p.lng)}});
  }catch(e){
    if(CUR.route!=='capture')return;
    $('#camFallback')?.classList.remove('hide');setFlashState('unavailable');
    const sh=$('#btnShutter');const had=document.activeElement===sh||document.activeElement===document.body;if(sh)sh.disabled=true;
    if(had)$('#btnGallery')?.focus({preventScroll:true});
  }
}
function stopCamera(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
function closeCamera(){go('home')}
// Flash = the camera torch where the device exposes it; otherwise the control says so and stays disabled.
function initTorch(){const t=camStream?.getVideoTracks?.()[0];let ok=false;try{ok=!!(t&&t.getCapabilities&&t.getCapabilities().torch)}catch(_){}setFlashState(ok?'off':'unavailable')}
function setFlashState(st){const b=$('#btnFlash'),l=$('#flashLbl');if(!b||!l)return;b.dataset.state=st;b.disabled=st==='unavailable';b.setAttribute('aria-pressed',st==='on'?'true':'false');l.textContent={on:'On',off:'Off',unavailable:'Unavailable'}[st]}
function updateCamOpts(){
  const d=CUR.draft||{};const a=$('#optAuto');if(!a)return;
  const hasKey=!!S.apiKey,on=hasKey&&S.autoSize!==false;
  a.classList.toggle('ok',on);a.setAttribute('aria-pressed',on?'true':'false');$('#optAutoLbl').textContent=hasKey?(on?'On':'Off'):'Needs AI key';
  $('#optLenLbl').textContent=d.len?num(d.len)+' in':'Optional';$('#optWtLbl').textContent=d.wt?num(d.wt)+' lb':'Optional';
  $('#optLen').classList.toggle('ok',!!d.len);$('#optWt').classList.toggle('ok',!!d.wt);
  const sp=d.sp?SP[d.sp]:null;$('#camMatchName').textContent=sp?sp.n:'Choose species';
  $('#camMatch').setAttribute('aria-label',sp?`Species: ${sp.n}. Change species`:'Species not set. Choose it now, or after the shot');
}
function measureSheet(kind){
  const isLen=kind==='len',d=CUR.draft;if(!d)return;
  const bg=sheet(`<h3>${isLen?'Add length':'Add weight'}</h3><div class="field"><label for="msInput">${isLen?'Length in inches':'Weight in pounds'}</label><input class="inp" id="msInput" type="number" inputmode="decimal" step="0.1" min="${isLen?1:0}" max="${isLen?200:500}" value="${d[kind]??''}" placeholder="${isLen?'e.g. 24.5':'e.g. 6.2'}"></div><div class="grid2" style="margin-top:14px"><button class="btn ghost" data-x>Cancel</button><button class="btn" data-ok>Save</button></div>`);
  const inp=$('#msInput',bg);
  const saveIt=()=>{const raw=inp.value.trim();const v=raw===''?null:parseFloat(raw);if(v!=null&&(isNaN(v)||v<(isLen?1:0)||v>(isLen?200:500))){toast(isLen?'Length must be 1 to 200 inches':'Weight must be 0 to 500 pounds');inp.focus();return}d[kind]=v;if(isLen)d.method=v?'manual':d.method;bg.close();updateCamOpts();announce(v==null?(isLen?'Length cleared':'Weight cleared'):(isLen?`Length ${num(v)} inches`:`Weight ${num(v)} pounds`))};
  bg.querySelector('[data-x]').onclick=()=>bg.close();bg.querySelector('[data-ok]').onclick=saveIt;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveIt()}});
}
function getPosition(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{timeout:8000,maximumAge:60000})})}
document.addEventListener('click',e=>{
  if(e.target.closest('#btnShutter')){const sh=$('#btnShutter');if(!sh||sh.disabled||sh.getAttribute('aria-busy')==='true')return;const v=$('#camVideo');if(!v||!v.videoWidth){toast('Camera is still starting');return}sh.setAttribute('aria-busy','true');const c=document.createElement('canvas');const W=Math.min(1600,v.videoWidth);c.width=W;c.height=Math.round(v.videoHeight*W/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{if(b)gotPhoto(b);else{sh.removeAttribute('aria-busy');toast('Could not capture that frame')}},'image/jpeg',.9);return}
  if(e.target.closest('#btnGallery')){$('#fileGallery').click();return}
  if(e.target.closest('#btnFlash')){const b=$('#btnFlash'),t=camStream?.getVideoTracks?.()[0];if(!t||b.disabled)return;const on=b.dataset.state!=='on';t.applyConstraints({advanced:[{torch:on}]}).then(()=>setFlashState(on?'on':'off')).catch(()=>{setFlashState('unavailable');toast('Flash is not available on this camera')});return}
  const o=e.target.closest('[data-copt]');if(o&&CUR.route==='capture'){if(o.dataset.copt==='auto'){if(!S.apiKey){toast('Add an Anthropic API key in Settings to estimate size from the photo',3200);return}S.autoSize=S.autoSize===false;save();updateCamOpts();announce('Auto-detect size '+(S.autoSize!==false?'on':'off'));return}measureSheet(o.dataset.copt);return}
  if(e.target.closest('#camMatch')&&CUR.draft){speciesPicker(id=>{CUR.draft.sp=id;CUR.draft.aiConf=null;updateCamOpts()});return}
});
$('#fileGallery').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!CUR.draft||CUR.route!=='capture'){CUR.draft={id:uid(),ts:Date.now(),privacy:S.privacy,released:false}}const b=await downscale(f,1600);
  // try EXIF-free fallback: use file's lastModified as catch time if older than an hour
  if(f.lastModified&&Date.now()-f.lastModified>3600e3)CUR.draft.ts=f.lastModified;
  gotPhoto(b)});
function downscale(file,max){return new Promise(res=>{const img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(b=>res(b||file),'image/jpeg',.88)};img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}
let photoBusy=false;
async function gotPhoto(blob){
  if(photoBusy)return;photoBusy=true; // one photo per capture, even on a double tap
  try{
    stopCamera();
    const d=CUR.draft;d.hasPhoto=true;d.blob=blob;
    await DB.put(d.id,blob);
    const old=urlCache.get(d.id);if(old)URL.revokeObjectURL(old);urlCache.set(d.id,URL.createObjectURL(blob));
    if(d.lat==null){const p=await getPosition();if(p){d.lat=p.lat;d.lng=p.lng;d.region=regionFrom(p.lat,p.lng)}}
    go('review');
  }finally{photoBusy=false}
}

/* ---------- Species identification ---------- */
function blobToB64(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(blob)})}
async function identify(blob){
  if(!S.apiKey){ // demo: offer a short list the user confirms
    const pool=SPECIES.filter(s=>s.r<=2&&(S.homeRegion.includes('Coast')||S.homeRegion.includes('Sound')?true:s.w!=='salt'));
    const pick=pool[Math.floor(Math.random()*pool.length)];
    return {demo:true,species:pick.id,confidence:null,alternates:pool.filter(s=>s.id!==pick.id).slice(0,3).map(s=>s.id),length:null};
  }
  const b64=await blobToB64(blob);
  const list=SPECIES.map(s=>`${s.id}: ${s.n} (${s.sci})`).join('\n');
  const schema={type:'object',additionalProperties:false,required:['species_id','confidence','alternates','estimated_length_in','fish_present','note'],properties:{
    species_id:{type:'string',enum:SPECIES.map(s=>s.id).concat(['unknown'])},confidence:{type:'number',minimum:0,maximum:1},
    alternates:{type:'array',items:{type:'string',enum:SPECIES.map(s=>s.id)},maxItems:3},estimated_length_in:{type:['number','null']},fish_present:{type:'boolean'},note:{type:'string'}}};
  const body={model:S.model||'claude-opus-5',max_tokens:1024,
    output_config:{format:{type:'json_schema',schema},effort:'medium'},
    system:'You identify fish for a Pacific Northwest angling registry. Return only the JSON requested. Choose species_id from the provided list; use "unknown" when no fish is visible or none of the listed species fits. Estimate total length in inches only when a reliable size reference (hand, ruler, rod grip, known object) is visible; otherwise null. Keep note under 20 words.',
    messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:blob.type||'image/jpeg',data:b64}},{type:'text',text:'Identify the fish in this photo.\n\nSpecies list:\n'+list}]}]};
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('ID request failed ('+r.status+') '+t.slice(0,160))}
  const j=await r.json();
  if(j.stop_reason==='refusal')throw new Error('The identifier declined this photo');
  const txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  const o=JSON.parse(txt);
  return {demo:false,species:o.fish_present&&o.species_id!=='unknown'?o.species_id:null,confidence:o.confidence,alternates:o.alternates||[],length:o.estimated_length_in,note:o.note};
}

/* ---------- Catch Review ---------- */
ROUTES.review = ()=>{
  const d=CUR.draft;if(!d||!d.hasPhoto){return ROUTES.capture()}
  CUR.after=async()=>{
    const ph=$('#revPhoto');if(ph){const u=await photoURL({id:d.id});if(u)ph.innerHTML=`<img src="${u}" alt="Your catch">`}
    if(d.idDone||d.idBusy)return; // re-renders while identifying must not start another (paid) request
    d.idBusy=true;
    try{const r=await identify(d.blob||await DB.get(d.id));d.idDone=true;d.id_=r;if(r.species&&!d.sp){d.sp=r.species;d.aiConf=r.confidence}if(r.length&&!d.len&&S.autoSize!==false){d.len=Math.round(r.length*10)/10;d.method='ai'}
      announce(d.sp?`Species: ${SP[d.sp].n}${d.aiConf!=null?', '+Math.round(d.aiConf*100)+' percent match':''}`:'Species not identified. Choose it from the list.')}
    catch(e){d.idDone=true;d.id_={error:e.message};toast(e.message,3500)}
    finally{d.idBusy=false}
    if(CUR.route==='review'&&CUR.draft===d){readReview();render()}
  };
  const sp=d.sp?SP[d.sp]:null;const r=d.id_;
  return `<div class="centerh"><button class="back" id="revBack">${I.back}</button><h1>Catch Review</h1><p>Confirm the details, then get your verdict.</p></div>
  <div class="review-photo" id="revPhoto"></div>
  <div class="card" style="margin-top:12px">

  ${mine.length<S.catches.length?`<p class="faint small" style="margin:0 0 10px">${S.catches.length-mine.length} catch${S.catches.length-mine.length===1?'':'es'} without a GPS fix are listed below but not pinned.</p>`:''}
  <div class="stack">${list.slice(0,30).map(c=>catchRow(c)).join('')||'<div class="card muted small">No catches match these filters.</div>'}</div>`;
};
document.addEventListener('change',e=>{if(e.target.id==='mapSp'){mapSpecies=e.target.value;render()}if(e.target.id==='mapDays'){mapDays=+e.target.value;render()}});

function removeDemo(){const gone=S.catches.filter(c=>c.demo);S.catches=S.catches.filter(c=>!c.demo);S.xp=S.catches.reduce((a,c)=>a+(c.xp||0),0);S.achievements={};S.challengesDone={};for(const a of ACHIEVEMENTS)if(a.test(S))S.achievements[a.id]=Date.now();for(const ch of CHALLENGES)if(challengeProgress(ch)===ch.sp.length)S.challengesDone[ch.id]=Date.now();S.demo=false;save()}

/* ---------- Boot ---------- */
(function boot(){
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  const [r,id]=location.hash.slice(1).split('/');
  if(!S.onboarded){CUR.route='onboarding'}else{CUR.route=ROUTES[r]?r:'home';CUR.params=id?{id}:{}}
  if(CUR.route==='review'||CUR.route==='verdict'&&!id)CUR.route='home';
  render();
  window.addEventListener('pagehide',stopCamera);
  document.addEventListener('visibilitychange',()=>{if(CUR.route!=='capture')return;if(document.hidden)stopCamera();else if(!camStream)startCamera()});
})();
